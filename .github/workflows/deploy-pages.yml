name: Deploy GitHub Pages

on:
  push:
    branches:
      - arena/01a0dd27-frost-clear-pilot-quartz
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static GitHub Pages app
        run: npm run build:github
        env:
          GITHUB_PAGES: "true"

      # The repository Pages source is configured as GitHub Actions.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-github

  deploy:
    # Use a dedicated environment so this fixed Arena branch is deployable
    # without the repository's main-branch-only protection on github-pages.
    environment:
      name: github-pages-arena
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
