[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Ensure Nitro selects the Netlify server preset during CI builds.
  NETLIFY = "true"

# TanStack Start + Nitro generates the Netlify server/function output during build.
# Authentication and business data use Supabase directly; this deployment
# does not require a separate PostgreSQL connection string.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
